name: Build Android APK (GachiRemind)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android platform & sync
        run: |
          npx cap add android || npx cap sync android
          npx cap sync android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GachiRemind APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GachiRemind-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
